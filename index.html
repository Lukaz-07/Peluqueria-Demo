<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Premium - Reservas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-container">
        <header>
            <div class="logo-container">
                <img src="https://i.gyazo.com/4c6794942ebbc8611a92433b9a127b09.png" alt="Logo Barbería" class="logo">
            </div>
            <h1>BARBERÍA DEMO</h1>
            <p class="subtitle">Reservá tu experiencia</p>
        </header>

        <form id="form-reserva">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Tu Nombre</label>
                    <input type="text" id="nombre" placeholder="Ej: Luciano Salvador" required>
                </div>
                <div class="form-group">
                    <label for="whatsapp">Tu WhatsApp</label>
                    <input type="tel" id="whatsapp" placeholder="Ej: 3424123456" required>
                </div>
            </div>

            <div class="form-group">
                <label for="servicio">Servicio</label>
                <select id="servicio" required>
                    <option value="" disabled selected>Seleccioná una opción...</option>
                    <option value="Corte de Pelo - $9.000">Corte de Pelo - $9.'00</option>
                    <option value="Corte y Barba - $10.000">Corte y Barba - $10.000</option>
                    <option value="Perfilado de Barba - $1.000">Perfilado de Barba - $1.000</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="fecha">Día</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label for="hora">Hora</label>
                    <select id="hora" required>
                        <option value="" disabled selected>Horario...</option>
                        <option value="10:00 hs">10:00 hs</option>
                        <option value="11:00 hs">11:00 hs</option>
                        <option value="13:00 hs">13:00 hs</option>
                        <option value="14:00 hs">14:00 hs</option>
                        <option value="15:00 hs">15:00 hs</option>
                        <option value="16:00 hs">16:00 hs</option>
                        <option value="17:00 hs">17:00 hs</option>
                        <option value="18:00 hs">18:00 hs</option>
                        <option value="19:00 hs">19:00 hs</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-enviar">Confirmar Reserva</button>
        </form>

        <footer>
            <p>© 2026 Barbería Demo. LucasM.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
